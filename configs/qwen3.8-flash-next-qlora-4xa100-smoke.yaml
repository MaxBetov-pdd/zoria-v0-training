# 4xA100 smoke test for the selected large VPS.
# This is an experimental multi-GPU path because upstream Flash-Next
# integration was validated on 1xB300, not on multi-GPU A100.

base_model: Qwen/Qwen3.8-Flash-Next

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin

load_in_8bit: false
load_in_4bit: true
quantize_moe_experts: true
ple_cpu_offload: true

datasets:
  - path: ./data/processed/zoria_v0_train.jsonl
    type: chat_template
    field_messages: messages

dataset_prepared_path: ./data/prepared-4xa100-smoke
val_set_size: 0.02
output_dir: ./outputs/zoria-v0-4xa100-smoke

adapter: qlora
sequence_len: 2048
sample_packing: true
train_on_inputs: false

lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules:
  - linear_attn.in_proj_qkv
  - linear_attn.in_proj_z
  - linear_attn.in_proj_b
  - linear_attn.in_proj_a
  - linear_attn.out_proj
  - shared_expert.up_proj
  - shared_expert.down_proj
  - shared_expert.gate_proj
  - q_proj
  - v_proj
  - k_proj
  - o_proj
lora_target_parameters:
  - mlp.experts.gate_up_proj
  - mlp.experts.down_proj

lora_mlp_kernel: false
lora_qkv_kernel: false
lora_o_kernel: false

gradient_accumulation_steps: 2
micro_batch_size: 1
max_steps: 20
optimizer: adamw_bnb_8bit
lr_scheduler: cosine
learning_rate: 0.0001
warmup_ratio: 0.1
weight_decay: 0.01
max_grad_norm: 1.0

bf16: auto
tf32: false
gradient_checkpointing: true
attn_implementation: sdpa
gradient_checkpointing_kwargs:
  use_reentrant: true

fsdp:
  - full_shard
  - auto_wrap
fsdp_config:
  fsdp_limit_all_gathers: true
  fsdp_sync_module_states: true
  fsdp_offload_params: false
  fsdp_use_orig_params: false
  fsdp_cpu_ram_efficient_loading: true
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_transformer_layer_cls_to_wrap: Qwen4ExpTextDecoderLayer
  fsdp_state_dict_type: FULL_STATE_DICT
  fsdp_sharding_strategy: FULL_SHARD
  fsdp_activation_checkpointing: true

logging_steps: 1
eval_steps: 10
save_steps: 20
save_total_limit: 1
seed: 42
